[project]
name = "usability-multiagent"
version = "2.0.0"
description = "Sistema multiagente distribuido para la evaluacion heuristica de interfaces web"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "pyyaml>=6.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "google-genai>=0.1.0",
    "google-adk>=2.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
include = ["shared*", "orchestrator*", "web_explorer*", "evaluators*", "report_creator*"]
