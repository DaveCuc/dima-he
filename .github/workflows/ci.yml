name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Unit Tests & Contract Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python syntax across all modules
        run: |
          python -m compileall shared tests orchestrator web_explorer evaluators report_creator

      - name: Start Playwright MCP Infrastructure
        run: |
          docker compose up -d playwright-mcp
          # Esperar a que el servidor MCP sobre SSE esté listo
          for i in $(seq 1 30); do
            if curl -s http://localhost:8931/sse > /dev/null; then
              echo "Playwright MCP listo en http://localhost:8931/sse"
              break
            fi
            echo "Esperando a Playwright MCP ($i/30)..."
            sleep 1
          done

      - name: Execute Pytest Suite (Unit & Integration)
        env:
          PYTHONPATH: .
        run: |
          pytest -v --tb=short
