name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Unit Tests & Contract Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python syntax across all modules
        run: |
          python -m compileall shared tests orchestrator web_explorer evaluators report_creator

      - name: Start Playwright MCP Infrastructure
        run: |
          mkdir -p evidence
          chmod -R 777 evidence
          docker compose up -d playwright-mcp
          # Esperar a que el servidor Playwright MCP esté listo (consultando / con timeout de 2s para no bloquear en SSE)
          for i in $(seq 1 30); do
            if curl -s -m 2 -o /dev/null http://localhost:8931/; then
              echo "Playwright MCP listo y respondiendo en http://localhost:8931"
              break
            fi
            echo "Esperando a Playwright MCP ($i/30)..."
            sleep 1
          done
          # Asegurar permisos de lectura/escritura en el volumen montado de evidencias
          sudo chmod -R 777 evidence

      - name: Execute Pytest Suite (Unit & Integration)
        env:
          PYTHONPATH: .
          GOOGLE_API_KEY: "dummy-key-for-ci"
        run: |
          pytest -v --tb=short
